name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, github::tidyverse/tidytemplate, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Fix generated favicon MIME type
        run: |
          files <- list.files("docs", pattern = "\\.html$", recursive = TRUE, full.names = TRUE)
          curly <- intToUtf8(0x201d)
          bad_values <- c(
            paste0("type=\"", curly, "image/svg+xml", curly, "\""),
            paste0("type=", curly, "image/svg+xml", curly)
          )
          for (file in files) {
            html <- paste(readLines(file, warn = FALSE), collapse = "\n")
            for (bad in bad_values) {
              html <- gsub(bad, "type=\"image/svg+xml\"", html, fixed = TRUE)
            }
            writeLines(html, file, useBytes = TRUE)
          }
        shell: Rscript {0}

      - name: Remove local agent instruction pages
        run: |
          unlink(file.path("docs", c("AGENTS.html", "AGENTS.md")), force = TRUE)
          sitemap <- file.path("docs", "sitemap.xml")
          if (file.exists(sitemap)) {
            lines <- readLines(sitemap, warn = FALSE)
            writeLines(lines[!grepl("AGENTS", lines, fixed = TRUE)], sitemap, useBytes = TRUE)
          }
          search <- file.path("docs", "search.json")
          if (file.exists(search) && requireNamespace("jsonlite", quietly = TRUE)) {
            index <- jsonlite::fromJSON(search, simplifyVector = FALSE)
            keep <- vapply(index, function(entry) {
              path <- entry$path
              if (is.null(path) || !length(path)) return(TRUE)
              !grepl("AGENTS", as.character(path), fixed = TRUE)
            }, logical(1))
            jsonlite::write_json(index[keep], search, auto_unbox = TRUE)
          }
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true

url: https://oncologylab.github.io/craftgrn/

template:
  package: tidytemplate
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, news, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/oncologylab/craftgrn
      aria-label: GitHub

home:
  title: CraftGRN
  description: Integrative ATAC-RNA framework for condition-specific gene regulatory networks.
  links:
  - text: Report a bug
    href: https://github.com/oncologylab/craftgrn/issues

articles:
- title: Get started
  navbar: ~
  contents:
  - craftgrn

reference:
- title: App and configuration
  desc: Start the app and load project configuration files.
  contents:
  - run_app
  - load_config
  - validate_config
  - craftgrn_demo_data_info
  - download_craftgrn_demo_data

- title: Multiomic data preparation
  desc: Load, save, and prepare matched ATAC and RNA inputs.
  contents:
  - load_omics_data
  - save_omics_data
  - load_prep_multiomic_data
  - as_multiomic_object
  - validate_multiomic_object
  - is_multiomic_object

- title: TF binding site and motif utilities
  desc: Work with motif resources, footprints, and TF-footprint correlations.
  contents:
  - predict_tfbs
  - module1_prepare_tfbs_inputs
  - module1_correlate_motif_supported_tfbs
  - module1_select_prediction_footprints
  - module1_predict_tfbs_from_correlations
  - build_predicted_tfbs
  - load_predicted_tfbs
  - export_predicted_tfbs_bed
  - starts_with("read_")
  - starts_with("parse_")
  - starts_with("load_motif")
  - starts_with("build_motif")
  - starts_with("compute_motif")
  - starts_with("best_pwm")
  - starts_with("pwm_")
  - utils_motif_clustering


- title: TF-target linking
  desc: Connect predicted TF binding sites to target genes and query compact Module 2 outputs.
  contents:
  - link_tf_targets
  - module2_prepare_link_inputs
  - module2_correlate_tf_targets
  - module2_build_fp_target_candidates
  - module2_correlate_fp_targets
  - module2_assemble_links
  - load_gene_tss
  - load_module2_links
  - query_module2_links
  - validate_module2_links
  - export_tf_target_bedpe
  - build_module2_reports
  - export_top_tf_targets
  - export_direct_tf_tf_browser
  - export_tf_tf_connectivity_browser
- title: Regulatory topic modeling
  desc: Build topic model inputs, train models, and extract regulatory topics.
  contents:
  - module3_prepare_differential_links
  - train_topic_models
  - extract_regulatory_topics
  - starts_with("build_doc_term")
  - starts_with("run_vae")
  - load_delta_links_many
  - build_tf_cluster_map_from_motif
  - weight_to_count

- title: Differential GRN pathway analysis
  desc: Run pathway enrichment and visualize differential regulatory programs.
  contents:
  - default_diff_grn_pathway_databases
  - run_diff_grn_pathway_analysis
  - run_diff_grn_pathway_enrichment
  - read_diff_grn_pathway_enrichment
  - select_diff_grn_pathway_terms
  - plot_diff_grn_pathway_dotplot
  - plot_diff_grn_pathway_network

- title: Master TF summaries
  desc: Summarize and plot master TF connectivity in differential GRNs.
  contents:
  - run_diff_grn_master_tf_summary
  - summarize_diff_grn_master_tf_links
  - starts_with("plot_diff_grn_master_tf")

- title: Internal documentation helpers
  desc: Helper topics used by generated documentation.
  contents:
  - ends_with("_docs")
  - cutree_to_k
  - pairwise_comparisons
  - "%>%"

development:
  mode: auto

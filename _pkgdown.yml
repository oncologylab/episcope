url: https://oncologylab.github.io/craftgrn/

template:
  package: tidytemplate
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, news, articles]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/oncologylab/craftgrn
      aria-label: GitHub

home:
  title: CraftGRN
  description: Integrative ATAC-RNA framework for condition-specific gene regulatory networks.

articles:
- title: Get started
  navbar: ~
  contents:
  - craftgrn

reference:
- title: App and configuration
  desc: Start the app and load project configuration files.
  contents:
  - run_app
  - load_config
  - validate_config
  - craftgrn_demo_data_info
  - download_craftgrn_demo_data

- title: Multiomic data preparation
  desc: Load, save, and prepare matched ATAC and RNA inputs.
  contents:
  - load_omics_data
  - save_omics_data
  - load_prep_multiomic_data

- title: TF binding site prediction
  desc: Predict transcription factor binding sites from motif-supported footprints and TF expression.
  contents:
  - predict_tfbs
  - build_module1_qc_report
  - module1_prepare_tfbs_inputs
  - module1_correlate_TF_to_canonical_tfbs
  - module1_filter_canonical_bound_tfbs
  - module1_predict_full_tfbs
  - output_predicted_tfbs
  - load_predicted_tfbs
  - export_predicted_tfbs_bed


- title: Predict TF targets
  desc: Predict TF targets through TFBS-target and TF-target correlations.
  contents:
  - predict_tf_targets
  - build_module2_qc_report
  - module2_identify_candidate_links
  - module2_correlate_tf_targets
  - module2_link_fp_targets
  - module2_correlate_fp_targets
  - output_predicted_links
  - load_predicted_links
  - query_predicted_links
  - check_module2_links
  - export_tf_target_bedpe
  - report_top_tf_targets
  - report_direct_tf_tf_regulations
  - report_tf_tf_coregulations
- title: Regulatory topic modeling
  desc: Build topic inputs, train models, extract topics, and review Module 3 outputs.
  contents:
  - module3_prepare_differential_links
  - run_regulatory_topics
  - build_module3_qc_report
  - module3_prepare_topic_inputs
  - train_topic_models
  - extract_regulatory_topics
  - run_module3_topic_benchmark
  - load_delta_links_many
  - build_tf_cluster_map_from_motif

- title: Differential GRN pathway analysis
  desc: Run pathway enrichment and visualize differential regulatory programs.
  contents:
  - default_diff_grn_pathway_databases
  - run_diff_grn_pathway_analysis
  - run_diff_grn_pathway_enrichment
  - read_diff_grn_pathway_enrichment
  - select_diff_grn_pathway_terms
  - plot_diff_grn_pathway_dotplot
  - plot_diff_grn_pathway_network

- title: Master TF summaries
  desc: Summarize and plot master TF connectivity in differential GRNs.
  contents:
  - run_diff_grn_master_tf_summary
  - summarize_diff_grn_master_tf_links
  - starts_with("plot_diff_grn_master_tf")

development:
  mode: auto
